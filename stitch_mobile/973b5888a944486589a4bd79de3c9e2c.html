      </a>

</div>
<script>
  // Toggle password visibility
  const toggleBtn = document.getElementById('toggle-pwd');
  const pwdInput = document.getElementById('pwd-input');
  const eyeIcon = document.getElementById('eye-icon');

  if (toggleBtn && pwdInput && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  // Interactive expertise tags toggling
  const tags = document.querySelectorAll('.expertise-tag');
  tags.forEach(tag => {
    tag.addEventListener('click', () => {
      const isSelected = tag.classList.contains('bg-secondary-container');
      if (isSelected) {
        tag.classList.remove('bg-secondary-container', 'text-on-secondary-fixed');
        tag.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
        tag.innerHTML = `<span class="w-3.5 h-3.5 rounded-full bg-surface-variant"></span><span>${tag.textContent.trim()}</span>`;
      } else {
        tag.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');
        tag.classList.add('bg-secondary-container', 'text-on-secondary-fixed');
        tag.innerHTML = `<span class="material-symbols-outlined text-base" style="font-variation-settings: 'FILL' 1;">check_circle</span><span>${tag.textContent.trim()}</span>`;
      }
    });
  });
