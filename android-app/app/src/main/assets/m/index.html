<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#140E2D"/>
  <title>Intalent — Application Mobile</title>
  <link rel="icon" type="image/png" href="/assets/logos/logo-white-purple.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#140E2D', purple: '#281358', accent: '#B04BFF',
              neon: '#CEF238', neonHover: '#BCE521', surface: '#F8F9FA', card: '#FFFFFF', olive: '#24301B'
            }
          },
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
          boxShadow: {
            soft: '0 4px 20px -2px rgba(20, 14, 45, 0.05)',
            card: '0 2px 10px rgba(0, 0, 0, 0.04)',
            nav: '0 -4px 25px rgba(0, 0, 0, 0.06)'
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/m/m.css"/>
</head>
<body class="h-full font-sans antialiased text-slate-800 bg-slate-950">
  <div id="m-shell" class="relative mx-auto w-full max-w-[440px] min-h-full bg-brand-surface flex flex-col">
    <main id="m-view" class="flex-1 px-4 pt-3 pb-28"></main>
    <nav id="m-nav" class="hidden"></nav>
  </div>
  <div id="m-sheet-backdrop" class="hidden fixed inset-0 bg-black/50 z-[60]"></div>
  <div id="m-sheet" class="hidden fixed bottom-0 inset-x-0 mx-auto max-w-[440px] bg-white rounded-t-3xl z-[70] max-h-[88vh] overflow-y-auto p-5"></div>
  <div id="m-toast" class="hidden fixed top-4 inset-x-0 mx-auto max-w-[400px] z-[80] px-4"></div>

  <script src="/m/core.js"></script>
  <script src="/m/screens-main.js"></script>
  <script src="/m/screens-work.js"></script>
  <script src="/m/screens-spaces.js"></script>
</body>
</html>
